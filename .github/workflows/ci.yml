name: Go
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', stable]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false # No external dependencies or go.sum.
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
      - run: go test -race -cover ./...
      - name: Test 32-bit arithmetic
        run: GOARCH=386 go test ./...
      - name: Bounded fuzz smoke tests
        if: matrix.go == 'stable'
        run: |
          go test -run '^$' -fuzz '^FuzzNew$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzSafeReader$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzImports$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzCountImportThunks$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzDelayImports$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzExports$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzCertificates$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzResources$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzRichHeader$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzDebug$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzVersionInfo$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzAuthenticode$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzAuthenticodeDigest$' -fuzztime=15s -parallel=2
          go test -run '^$' -fuzz '^FuzzAuthenticodeVerify$' -fuzztime=15s -parallel=2
  export-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Compare ordinary export records
        working-directory: benchmarks/exports
        run: go test -race ./...

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - name: Validate native compilers and offline Windows trust
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/native-validation.ps1

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check library and standard library
        run: govulncheck -test ./...
      - name: Check comparison dependencies
        working-directory: benchmarks/exports
        run: govulncheck -test ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint root module
        run: golangci-lint run ./...
      - name: Lint comparison module
        working-directory: benchmarks/exports
        run: golangci-lint run --config ../../.golangci.yml ./...
