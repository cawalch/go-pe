version: "2"

linters:
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - intrange
    - perfsprint
    - revive
    - staticcheck
    - unused
  settings:
    revive:
      rules:
        - name: redefines-builtin-id
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - perfsprint
          - unparam
          - revive
